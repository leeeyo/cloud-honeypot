name: CI Pipeline
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run all validation checks
        run: |
          echo "Running comprehensive validation checks..."
          # Check for required files
          test -f terraform/main.tf || (echo "Missing terraform/main.tf" && exit 1)
          test -f playbooks/vm-falco.yml || (echo "Missing playbooks/vm-falco.yml" && exit 1)
          test -f ansible.cfg || (echo "Missing ansible.cfg" && exit 1)
  terraform-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'
      - name: Terraform Format
        run: terraform fmt -check -recursive
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate
  ansible-check:
    name: Ansible Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ansible
        run: |
          pip install ansible ansible-lint yamllint
          ansible-galaxy collection install kubernetes.core community.general
      - name: Ansible Lint
        run: ansible-lint playbooks/ roles/ --exclude .github/
      - name: Ansible Syntax Check
        run: |
          ansible-playbook --syntax-check playbooks/vm-falco.yml
          ansible-playbook --syntax-check playbooks/aks-falco.yml