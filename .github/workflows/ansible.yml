name: Ansible Linting and Validation
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'playbooks/**'
      - 'roles/**'
      - 'inventories/**'
      - 'group_vars/**'
      - '.github/workflows/ansible.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'playbooks/**'
      - 'roles/**'
      - 'inventories/**'
      - 'group_vars/**'
      - '.github/workflows/ansible.yml'
  workflow_dispatch:

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: debian-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          pip install --upgrade pip
          pip install ansible ansible-lint yamllint
          ansible-galaxy collection install kubernetes.core community.general

      - name: Run ansible-lint
        run: |
          ansible-lint playbooks/ roles/ --exclude .github/

      - name: Run yamllint
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 120}}}' playbooks/ roles/ inventories/ group_vars/
  ansible-syntax-check:
    name: Ansible Syntax Check
    runs-on: debian-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ansible and dependencies
        run: |
          pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install kubernetes.core community.general
      - name: Ansible Syntax Check
        run: |
          ansible-playbook --syntax-check playbooks/vm-falco.yml
          ansible-playbook --syntax-check playbooks/aks-falco.yml
          ansible-playbook --syntax-check site.yml