name: Security Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if language files exist
        id: check-files
        run: |
          has_files=false
          if [ "${{ matrix.language }}" == "python" ]; then
            count=$(find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./venv/*" | wc -l)
            if [ "$count" -gt 0 ]; then
              has_files=true
            fi
          elif [ "${{ matrix.language }}" == "javascript" ]; then
            count=$(find . \( -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" \) -not -path "./.git/*" -not -path "./node_modules/*" | wc -l)
            if [ "$count" -gt 0 ]; then
              has_files=true
            fi
          fi
          echo "has_files=$has_files" >> $GITHUB_OUTPUT

      - name: Initialize CodeQL
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: steps.check-files.outputs.has_files == 'true'
        uses: github/codeql-action/analyze@v4

      - name: Skip CodeQL (no source files)
        if: steps.check-files.outputs.has_files == 'false'
        run: |
          echo "No ${{ matrix.language }} source files found. Skipping CodeQL analysis."

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yaml-scan:
    name: YAML Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run yamllint security checks
        run: |
          pip install yamllint
          yamllint -d '{extends: default, rules: {line-length: {max: 120}, truthy: {allowed-values: ["true", "false"]}}}' \
            playbooks/ roles/ inventories/ group_vars/
