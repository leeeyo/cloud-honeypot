name: Terraform + Ansible Integration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      run_ansible:
        description: 'Run Ansible playbook after Terraform'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'playbooks/**'
      - 'roles/**'

env:
  TF_VERSION: '1.13.4'
  AZURE_LOCATION: 'francecentral'

jobs:
  terraform-deploy:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: debian-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Get Terraform Outputs
        id: terraform-outputs
        if: github.event.inputs.action == 'apply' && (github.event.inputs.run_ansible != false)
        run: |
          echo "vm_public_ip=$(terraform output -raw vm_public_ip)" >> $GITHUB_OUTPUT
          echo "vm_username=$(terraform output -raw vm_username)" >> $GITHUB_OUTPUT
          echo "ssh_private_key<<EOF" >> $GITHUB_OUTPUT
          terraform output -raw ssh_private_key >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Save SSH Key
        if: github.event.inputs.action == 'apply' && (github.event.inputs.run_ansible != false)
        run: |
          mkdir -p ~/.ssh
          echo "${{ steps.terraform-outputs.outputs.ssh_private_key }}" > ~/.ssh/terraform_key
          chmod 600 ~/.ssh/terraform_key
          ssh-keyscan -H ${{ steps.terraform-outputs.outputs.vm_public_ip }} >> ~/.ssh/known_hosts

      - name: Wait for VM to be ready
        if: github.event.inputs.action == 'apply' && (github.event.inputs.run_ansible != false)
        run: |
          echo "Waiting for VM to be ready..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if ssh -i ~/.ssh/terraform_key -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
               ${{ steps.terraform-outputs.outputs.vm_username }}@${{ steps.terraform-outputs.outputs.vm_public_ip }} \
               "echo 'VM is ready'"; then
              echo "VM is ready!"
              break
            fi
            attempt=$((attempt+1))
            echo "Attempt $attempt/$max_attempts: VM not ready yet, waiting 10 seconds..."
            sleep 10
          done

  ansible-deploy:
    name: Ansible Deploy Falco
    runs-on: ubuntu-latest
    needs: terraform-deploy
    if: github.event.inputs.action == 'apply' && (github.event.inputs.run_ansible != false)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install kubernetes.core community.general

      - name: Get Terraform Outputs
        id: terraform-outputs
        working-directory: terraform
        run: |
          echo "vm_public_ip=$(terraform output -raw vm_public_ip)" >> $GITHUB_OUTPUT
          echo "vm_username=$(terraform output -raw vm_username)" >> $GITHUB_OUTPUT

      - name: Save SSH Key
        run: |
          mkdir -p ~/.ssh
          cd terraform
          terraform output -raw ssh_private_key > ~/.ssh/terraform_key
          chmod 600 ~/.ssh/terraform_key
          ssh-keyscan -H ${{ steps.terraform-outputs.outputs.vm_public_ip }} >> ~/.ssh/known_hosts

      - name: Create temporary inventory
        run: |
          cat > /tmp/inventory.yml <<EOF
          ---
          all:
            children:
              linux:
                hosts:
                  vm-test:
                    ansible_host: ${{ steps.terraform-outputs.outputs.vm_public_ip }}
                    ansible_user: ${{ steps.terraform-outputs.outputs.vm_username }}
                    ansible_ssh_private_key_file: ~/.ssh/terraform_key
                    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
          EOF
          cat /tmp/inventory.yml

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i /tmp/inventory.yml playbooks/vm-falco.yml

      - name: Verify Falco installation
        run: |
          ssh -i ~/.ssh/terraform_key -o StrictHostKeyChecking=no \
            ${{ steps.terraform-outputs.outputs.vm_username }}@${{ steps.terraform-outputs.outputs.vm_public_ip }} \
            "sudo systemctl status falco --no-pager || echo 'Falco service check completed'"
