---
# =========================================
# Infrastructure Setup Playbook
# Installs and configures MySQL and OpenLDAP
# =========================================
- name: Setup Infrastructure (MySQL and OpenLDAP)
  hosts: linux
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display infrastructure setup start
      ansible.builtin.debug:
        msg: "Starting infrastructure setup on {{ inventory_hostname }}"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

  roles:
    - role: mysql
      tags:
        - mysql
        - database
        - infrastructure

    - role: openldap
      tags:
        - openldap
        - ldap
        - infrastructure

  post_tasks:
    - name: Verify MySQL is running
      ansible.builtin.systemd:
        name: mysql
        state: started
      register: mysql_service
      tags:
        - verify
        - mysql

    - name: Verify OpenLDAP is running
      ansible.builtin.systemd:
        name: slapd
        state: started
      register: ldap_service
      tags:
        - verify
        - openldap

    - name: Display infrastructure setup complete
      ansible.builtin.debug:
        msg: |
          Infrastructure setup complete!
          - MySQL: {{ 'Running' if mysql_service.status.ActiveState == 'active' else 'Not Running' }}
          - OpenLDAP: {{ 'Running' if ldap_service.status.ActiveState == 'active' else 'Not Running' }}
      tags:
        - verify

