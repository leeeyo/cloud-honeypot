---
# =========================================
# Auth-Lib Deployment Playbook
# Deploys the Spring Boot authentication application
# =========================================
- name: Deploy Auth-Lib Application
  hosts: linux
  become: true
  gather_facts: true

  vars:
    # Override this variable or set in inventory/group_vars
    auth_lib_jar_path: "{{ playbook_dir }}/../auth-lib/build/libs/Project1-1.0.0.jar"

  pre_tasks:
    - name: Display deployment start
      ansible.builtin.debug:
        msg: "Starting auth-lib deployment on {{ inventory_hostname }}"
      tags:
        - always

    - name: Check if JAR file path is defined
      ansible.builtin.fail:
        msg: "auth_lib_jar_path must be defined. Current value: {{ auth_lib_jar_path }}"
      when: auth_lib_jar_path == "" or auth_lib_jar_path is not defined
      tags:
        - always

    - name: Check if JAR file exists locally
      ansible.builtin.stat:
        path: "{{ auth_lib_jar_path }}"
      register: jar_file
      delegate_to: localhost
      become: false
      tags:
        - always

    - name: Fail if JAR file does not exist
      ansible.builtin.fail:
        msg: |
          JAR file not found at {{ auth_lib_jar_path }}
          Please build the application first:
            cd auth-lib && ./gradlew clean build -x test
      when: not jar_file.stat.exists
      tags:
        - always

    - name: Display JAR file info
      ansible.builtin.debug:
        msg: "Deploying JAR: {{ auth_lib_jar_path }} ({{ jar_file.stat.size | human_readable }})"
      when: jar_file.stat.exists
      tags:
        - always

    - name: Verify MySQL is available
      ansible.builtin.wait_for:
        port: "{{ auth_lib_mysql_port | default(mysql_port) | default(3306) }}"
        host: "{{ auth_lib_mysql_host | default('localhost') }}"
        timeout: 30
      tags:
        - verify
        - mysql

    - name: Verify LDAP is available (if using LDAP auth)
      ansible.builtin.wait_for:
        port: "{{ ldap_port | default(389) }}"
        host: localhost
        timeout: 30
      when: auth_lib_authentication_type | default('ldap') == 'ldap'
      tags:
        - verify
        - ldap

  roles:
    - role: auth-lib
      tags:
        - auth-lib
        - application
        - deploy

  post_tasks:
    - name: Wait for application to be ready
      ansible.builtin.wait_for:
        port: "{{ auth_lib_port | default(9090) }}"
        host: localhost
        delay: 10
        timeout: 120
      tags:
        - verify

    - name: Check application health
      ansible.builtin.uri:
        url: "http://localhost:{{ auth_lib_port | default(9090) }}/login"
        method: GET
        status_code: [200, 302]
        timeout: 10
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status in [200, 302]
      ignore_errors: true
      tags:
        - verify
        - health

    - name: Display deployment result
      ansible.builtin.debug:
        msg: |
          Auth-lib deployment complete!
          - Application URL: http://{{ ansible_host | default(inventory_hostname) }}:{{ auth_lib_port | default(9090) }}
          - Login page: http://{{ ansible_host | default(inventory_hostname) }}:{{ auth_lib_port | default(9090) }}/login
          - Health check: {{ 'Passed' if health_check.status in [200, 302] else 'Failed - check logs' }}
          - Service status: systemctl status auth-lib
          - Logs: journalctl -u auth-lib -f
      tags:
        - always

