---
# =========================================
# DEVELOPMENT INVENTORY
# =========================================
# 
# Note: Replace the ansible_host IPs with actual Terraform outputs
# After running 'terraform apply', get the IPs with:
#   terraform output vm_public_ips
#
# Or use the Terraform-generated inventory:
#   terraform output -raw ansible_inventory > inventories/dev/hosts.yml
#
# =========================================

all:
  children:
    # AKS Cluster (for Kubernetes deployments)
    aks:
      hosts:
        aks-dev:
          kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"
    
    # Linux VMs (honeypot servers)
    linux:
      hosts:
        honeypot-vm-1:
          ansible_host: "{{ lookup('env', 'HONEYPOT_VM1_IP') | default('10.0.1.10', true) }}"
          ansible_user: azizmaram
          ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('~/.ssh/id_rsa', true) }}"
        
        honeypot-vm-2:
          ansible_host: "{{ lookup('env', 'HONEYPOT_VM2_IP') | default('10.0.1.11', true) }}"
          ansible_user: azizmaram
          ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('~/.ssh/id_rsa', true) }}"
      
      vars:
        # Common variables for all linux hosts
        ansible_python_interpreter: /usr/bin/python3
